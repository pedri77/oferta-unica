name: Actualizar datos y publicar

on:
  schedule:
    - cron: "30 5 * * *"   # después de que Hacienda regenere los ficheros (04:00)
  push:
    branches: [main]
    paths: ["site/**", "scripts/**"]
  workflow_dispatch:
    inputs:
      anual:
        description: "Años completos a (re)cargar, separados por espacios (p. ej. 2023 2024)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recuperar el estado anterior
        run: |
          mkdir -p work
          if gh release download estado -D work -p 'state.sqlite.gz' -p 'manifest.json'; then
            gunzip -f work/state.sqlite.gz
            ls -la work
          else
            echo "Sin estado previo: carga completa"
          fi
      - name: Descargar y procesar datos nuevos
        run: |
          python scripts/fetch.py --db work/state.sqlite --desde 2025-01
          if [ -n "${{ github.event.inputs.anual }}" ]; then
            python scripts/fetch.py --db work/state.sqlite --anual ${{ github.event.inputs.anual }}
          fi
      - name: Calcular indicadores
        run: python scripts/build.py --db work/state.sqlite --out site/data
      - name: Guardar el estado
        run: |
          gzip -1 -k -f work/state.sqlite
          gh release view estado >/dev/null 2>&1 || gh release create estado --title "Estado del procesamiento" --notes "Base de datos intermedia (SQLite) y manifiesto de ficheros procesados. Se actualiza en cada ejecución; no es una publicación de datos."
          gh release upload estado work/state.sqlite.gz work/manifest.json --clobber
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
